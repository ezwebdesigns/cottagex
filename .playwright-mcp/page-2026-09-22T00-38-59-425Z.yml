            - generic [ref=f5e806]:
              - heading "Au bord des lacs. Près de la plage. Animaux acceptés. Adapté aux enfants. Trouvez le séjour idéal pour chaque occasion." [level=2] [ref=f5e807]
              - paragraph [ref=f5e808]: "Vous avez accès à un large choix de hébergements : mini chalets, chalets, grandes maisons et bien plus encore. Chaque location propose des petits plus pour rendre vos vacances inoubliables. Vous pourrez profiter d'un grand jardin pour votre chien, d'une piscine, d'un spa ou d'un barbecue pour vos repas en plein air, tout en vous sentant comme chez vous. Et le meilleur dans tout ça, c'est qu'il y en a pour tous les budgets. Vous pouvez même faire des économies pendant votre séjour en préparant vos propres repas dans les cuisines entièrement équipées."
              - link "Découvrez d'autres chalets sur VRBO" [ref=f5e809] [cursor=pointer]:
