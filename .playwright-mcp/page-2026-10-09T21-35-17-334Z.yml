                - heading [level=2] [ref=e101]:
                  - strong [ref=e102]: Why Mont-Tremblant?
                - paragraph [ref=e103]: Mont-Tremblant is the most famous resort in Quebec, and the chalet scene around it is just as strong. The pedestrian village at the base of the mountain is lively year round, with restaurants, shops, and events at every season.
                - paragraph [ref=e104]: The mountain itself is best known for skiing. Over 100 trails across a big, well maintained mountain make it a favorite for families and experts alike. But winter is only part of the story. Summer brings hiking, canoeing, and golf. Fall delivers some of the best colors in the province.
                - paragraph [ref=e105]:
