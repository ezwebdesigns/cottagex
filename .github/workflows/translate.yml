name: Translate EN to FR (DeepL)

on:
  workflow_dispatch:  # manual trigger
  # schedule:
  #   - cron: '0 2 * * 0'  # optional: every Sunday 2 AM

permissions:
  contents: write

env:
  DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Run translation script
        run: node scripts/translate-to-fr.mjs

      - name: Commit translated fr.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messages/fr.json
          git diff --staged --quiet || git commit -m "i18n: auto-translate missing FR keys via DeepL"
          git push